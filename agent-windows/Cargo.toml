[package]
name = "agent-windows"
version = "0.1.0"
edition = "2024"
authors = ["Stephen Tanimowo"]
description = "Vorqara Windows Endpoint Agent"
license = "Proprietary"

[dependencies]

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Configuration
dotenvy = "0.15"

# Logging
log = "0.4"
env_logger = "0.11"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# System Information
sysinfo = "0.37"

# MAC Address
mac_address = "1"

# Network
local-ip-address = "0.6"

# Hostname
hostname = "0.4"

# Error Handling
anyhow = "1"

# Async Traits
async-trait = "0.1"